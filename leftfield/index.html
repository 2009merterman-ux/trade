<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  /* Layout: a full-screen sky on canvas; the HUD floats on top, the prompt panel sits at the bottom. Single night-flight look by choice. */
  :root {
    color-scheme: dark;
    --ink: #f3f6ff;
    --dim: #aab5d8;

  body { height: 100%; margin: 0; overflow: hidden; background: #0b1430; color: var(--ink); font: 400 16px/1.45 var(--body); }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui {
    position: relative; height: 100%; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px 16px; pointer-events: none;
  }
  #ui > * { pointer-events: auto; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .label { font: 600 12px/1.2 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

  .hud { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .glass { background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .alt { border-radius: 14px; padding: 9px 14px 10px; min-width: 0; }
  .alt .num { display: flex; align-items: baseline; gap: 6px; }
  .alt b { font: 700 clamp(26px, 7vw, 36px)/1 var(--mono); font-variant-numeric: tabular-nums; }
  .alt .unit { font: 600 15px var(--mono); color: var(--dim); }
  .alt .zone { margin-top: 4px; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .pips { display: flex; gap: 6px; padding: 8px 10px; border-radius: 999px; }

  .pip.now { border-color: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .18); }
  .pip.miss { border-color: var(--bad); }
  .chip { border-radius: 999px; padding: 6px 12px; font: 600 12px/1 var(--body); letter-spacing: .06em; }

    border-radius: 14px; padding: 10px 18px 11px; text-align: center; width: max-content; max-width: min(88vw, 420px);
    pointer-events: none; animation: toast 1.9s ease both;
  }
  .toast b { display: block; font: 800 19px/1.2 var(--display); }
  .toast span { font-size: 14px; color: var(--dim); }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px) scale(.96); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1); } 82% { opacity: 1; } 100% { opacity: 0; } }

  .panel {
    align-self: center; width: 100%; max-width: 560px; max-height: 54vh; overflow: auto;
    border-radius: 20px; padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 12px;
  }

  .panel p { margin: 0; }
  .muted { color: var(--dim); }
  .title { font: 800 clamp(40px, 11vw, 60px)/.95 var(--display); margin: 0; letter-spacing: -.02em; }
  .title span { color: var(--t4); }

  .btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; background: var(--go); color: #fff; border: 0; border-radius: 12px; padding: 13px 20px; font: 800 18px/1 var(--display); letter-spacing: .02em; box-shadow: 0 6px 22px rgba(255, 90, 60, .35); }
  .btn:hover { filter: brightness(1.08); }
  .btn kbd { font: 600 11px/1 var(--body); letter-spacing: .1em; opacity: .75; }

  .legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }

  .legend b { display: block; font: 700 15px/1.1 var(--mono); }
  .legend span { font: 600 10.5px/1.2 var(--body); color: var(--dim); white-space: nowrap; }

  .fuel { display: flex; align-items: center; gap: 10px; }
  .tank { flex: 1; height: 10px; border-radius: 99px; background: rgba(255, 255, 255, .12); overflow: hidden; }
  .tank i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ffb347, #ff5a3c); transform-origin: left; }
  .tank i.low { background: var(--bad); }
  .secs { font: 700 20px/1 var(--mono); width: 2.2ch; text-align: right; font-variant-numeric: tabular-nums; }
  form { display: flex; gap: 10px; flex-wrap: wrap; margin: 0; }
  input[type=text] {
    flex: 1 1 200px; min-width: 0; background: rgba(0, 0, 0, .35); color: var(--ink);
    border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; font: 500 19px/1.2 var(--body);

  .note.wait { color: var(--dim); }
  .btn:disabled, input:disabled { opacity: .6; cursor: progress; }

  .count { font: 800 88px/1 var(--display); text-align: center; }
  .call { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .call strong { font: 800 clamp(28px, 8vw, 40px)/1 var(--display); letter-spacing: .01em; }
  .call em { font: 700 22px/1 var(--mono); font-style: normal; }
  .t0 { color: var(--t0); } .t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .t4 { color: var(--t4); } .t5 { background: linear-gradient(90deg, #ff4fd8, #ffd84a, #6dffa8, #5fd4ff, #c48bff); -webkit-background-clip: text; background-clip: text; color: transparent; } .out { color: var(--bad); }
  .answer { font-size: 21px; font-weight: 600; text-transform: capitalize; }
  .cap { text-transform: capitalize; }
  .tiers { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; border-top: 1px solid var(--line); padding-top: 12px; margin: 0; font-size: 15px; }
  .tiers dt { font: 600 12px/1.6 var(--body); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .tiers dd { margin: 0; text-transform: capitalize; overflow-wrap: anywhere; }
  .tiers dd b { text-decoration: underline; text-underline-offset: 3px; }

  .box { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: baseline; border-top: 1px solid var(--line); padding-top: 12px; }
  .box .a { text-transform: capitalize; font-weight: 500; overflow-wrap: anywhere; }
  .box .q { color: var(--dim); font-size: 14px; }
  .box .p { font: 700 16px/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; }
  .stats div { display: flex; flex-direction: column; gap: 4px; }
  .stats b { font: 700 20px/1 var(--mono); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .shake, .toast { animation-duration: .01s; } }
</style>

      h("div", { class: "label", text: "Stage " + (game.i + 1) + " of " + ROUNDS }),
      h("h2", { text: p.text }),
      h("div", { class: "fuel" }, [h("span", { class: "label", text: "Fuel" }), h("div", { class: "tank" }, [fill]), secs]),
      form, note
    ]);
    input.focus();
    var t0 = performance.now(), lastSec = SECONDS, over = false;
    function tick() {
      if (over) return;
      var left = SECONDS - (performance.now() - t0) / 1000;
      if (checking) { timer = requestAnimationFrame(tick); return; }
      if (left <= 0) { var typed = input.value.trim(); finish(local(typed), typed); return; }
      fill.style.transform = "scaleX(" + (left / SECONDS) + ")";
      fill.classList.toggle("low", left <= 5);
      var s = Math.ceil(left);
      if (s !== lastSec) { lastSec = s; secs.textContent = String(s); if (s <= 5) sfxTick(s === 1); }
      timer = requestAnimationFrame(tick);
    }
    var checking = false, pausedAt = 0, fire = form.querySelector("button");
    function local(typed) { return typed ? M.find(typed, p.compiled) : null; }
    function misfire(typed, msg) {
      note.className = "note";
      note.textContent = msg || "Misfire. “" + typed + "” doesn't fit. Try again.";
      input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
      input.focus(); input.select(); sputter();
    }
    function finish(hit, typed) {
      over = true; cancelAnimationFrame(timer); document.removeEventListener("visibilitychange", vis);
      var r = { prompt: p, typed: typed || "", pts: 0, tier: -1 };
      if (hit) { r.answer = hit.answer; r.tier = tierOf(p, hit.answer); r.pts = TIERS[r.tier].km; r.fixed = hit.how === "typo"; r.reason = hit.reason; boost(r.pts, r.tier); }
      else stall();
      game.results[game.i] = r;
      reveal(r);
    }
    function vis() { if (!document.hidden && !over) { cancelAnimationFrame(timer); tick(); } }
    document.addEventListener("visibilitychange", vis);
    form.onsubmit = function (e) {
      e.preventDefault();
      var typed = input.value.trim();
      if (over || checking || !typed) return;
      var hit = local(typed);
      if (hit) return finish(hit, typed);
      if (!judgeOK) return misfire(typed, "Misfire. “" + typed + "” isn't on the list. Try again.");
      checking = true; pausedAt = performance.now();
      input.disabled = true; fire.disabled = true;
      note.className = "note wait"; note.textContent = "Not on my list. Checking with mission control… (clock paused)";
      judge(p, typed).then(function (v) {
        checking = false; t0 += performance.now() - pausedAt;
        input.disabled = false; fire.disabled = false;
        if (over) return;
        if (!v) return misfire(typed, "Misfire. “" + typed + "” isn't on the list. Try again.");
        if (v.error) return misfire(typed, "Mission control didn't answer. Try another one.");
        if (v.valid === true) {
          var name = String(v.answer || typed).trim().slice(0, 60) || typed;
          var again = local(name);
          if (again) return finish({ answer: again.answer, how: "typo" }, typed);
          return finish({ answer: { name: name, tier: KRILLION }, how: "krillion", reason: String(v.reason || "").slice(0, 120) }, typed);
        }
        misfire(typed, v.reason ? "Mission control says no: " + String(v.reason).slice(0, 120) : null);
      });
    };
    tick();
  }

  function reveal(r) {
    drawPips();
    var last = game.i === ROUNDS - 1;
    var b = btn("next", last ? "SEE YOUR FLIGHT" : "NEXT STAGE", function () { if (last) end(); else { game.i++; atBat(); } });
    var top;
    if (r.answer) {
      top = [
        h("div", { class: "call" }, [h("strong", { class: "t" + r.tier, text: TIERS[r.tier].name.toUpperCase() }), h("em", { class: "t" + r.tier, text: "+" + r.pts + " km" })]),
        h("div", { class: "answer", text: r.answer.name }),
        r.tier === KRILLION ? h("p", { class: "muted", text: "Not on my list, and it's real. " + (r.reason || "") }) : null,
        r.fixed ? h("p", { class: "muted" }, ["You typed “" + r.typed + "”, read as ", h("span", { class: "cap", text: r.answer.name }), "."]) : null
      ];
    } else {
      top = [
        h("div", { class: "call" }, [h("strong", { class: "out", text: "ENGINE STALL" }), h("em", { class: "out", text: "+0 km" })]),
        h("p", { class: "muted", text: r.typed ? "Out of fuel before “" + r.typed + "” was fired." : "Out of fuel with nothing fired." })
      ];
    }
    show([h("div", { class: "label", text: r.prompt.text })].concat(top, [b]));
    b.focus();
  }

  function end() {
    game.done = true; drawPips();
    var total = game.results.reduce(function (s, r) { return s + r.pts; }, 0);
    store.games++; store.total += total; store.km += total;
    var record = total > store.best; if (record) store.best = total;
    save();
    var top = null; MILES.forEach(function (m) { if (total >= m.km) top = m; });
    var box = h("div", { class: "box" });
    game.results.forEach(function (r) {
      box.appendChild(h("div", null, [h("div", { class: "a", text: r.answer ? r.answer.name : "Stalled" }), h("div", { class: "q", text: r.prompt.text })]));
      box.appendChild(h("span", { class: "p " + (r.pts ? "t" + r.tier : "out"), text: "+" + r.pts }));
    });
    var b = btn("again", "FLY AGAIN", again);
    show([
      h("div", { class: "label", text: record && store.games > 1 ? "Flight complete · new record" : "Flight complete" }),
      h("h2", { text: total + " km" }),
      h("p", { text: top ? "Highest landmark: " + top.name + ". " + (total >= 100 ? "You made it to space." : "Space starts at 100 km.") : "Never really left the pad. Next flight's yours." }),
      b, statsRow(), box
    ]);
    b.focus();
  }

  function again() {
    tracking = false; onEnter = null;
    show([h("div", { class: "label", text: "Returning to the pad" }), h("h2", { text: "Refuelling…" })]);
    thrustTarget = idle = 0;
    flyTo(0, alt > 0 ? 1300 : 10, false, function () { countdown(); });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && onEnter && e.target.tagName !== "BUTTON" && e.target.tagName !== "INPUT") { e.preventDefault(); onEnter(); }
  });
  home();
})();
</script>
