<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140a2b">
<title>AdTrap Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Lilita One","Baloo 2","Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,sans-serif;
  --safe:max(env(safe-area-inset-top),0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:var(--font);font-weight:800;color:#fff;
  background:
    radial-gradient(circle at 15% 20%,rgba(124,58,237,.55),transparent 40%),
    radial-gradient(circle at 85% 80%,rgba(236,72,153,.45),transparent 40%),
    radial-gradient(circle at 80% 10%,rgba(56,189,248,.25),transparent 35%),
    #0b0614;
  display:flex;align-items:center;justify-content:center;
}
button{font-family:inherit;font-weight:inherit;cursor:pointer}
#phone{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;
  background:linear-gradient(180deg,#22113f,#0f0822);isolation:isolate}
@media (min-width:600px) and (min-height:620px){
  :root{--safe:26px}
  #phone{width:min(410px,calc((100dvh - 40px)*.47));height:min(880px,calc(100dvh - 40px));border-radius:46px;
    box-shadow:0 0 0 11px #0d0d12,0 0 0 13px #3b3b48,0 40px 90px rgba(0,0,0,.7)}
  #phone::after{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:96px;height:24px;border-radius:14px;background:#000;z-index:999;pointer-events:none}
}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding-top:var(--safe)}
.screen.on{display:flex}

/* ---------- HOME ---------- */
#home{overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#home>*{flex-shrink:0}
#home::-webkit-scrollbar{display:none}
.h-head{padding:14px 18px 4px;text-align:center}
.logo{font-size:38px;line-height:1;letter-spacing:.5px;
  background:linear-gradient(90deg,#ffd43b,#ff6b6b,#f06595,#cc5de8,#5c7cfa);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));animation:hue 6s linear infinite}
@keyframes hue{50%{filter:drop-shadow(0 3px 0 rgba(0,0,0,.35)) hue-rotate(40deg)}}
.tag{font-size:13px;opacity:.75;margin-top:6px;font-weight:700}
.stats{margin:12px 14px 0;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}
.stats b{display:block;font-size:20px;color:#ffd43b}
.stats span{font-size:11px;opacity:.7;font-weight:700}
.feat{margin:14px 14px 0;border-radius:24px;overflow:hidden;display:flex;gap:12px;padding:12px;position:relative;
  background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 8px 0 rgba(0,0,0,.25),0 16px 30px rgba(0,0,0,.4);cursor:pointer;border:none;color:#fff;text-align:left;width:calc(100% - 28px)}
.feat canvas{width:124px;height:220px;border-radius:16px;background:#000;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.feat .fx{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.feat .ftag{font-size:12px;background:rgba(0,0,0,.3);padding:4px 9px;border-radius:99px;align-self:flex-start}
.feat .fname{font-size:26px;line-height:1.05;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.feat .fhook{font-size:13px;opacity:.95;font-weight:700}
.feat .fplay{margin-top:4px;align-self:flex-start;padding:9px 16px;border-radius:14px;background:#fff;color:#222;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:pulse 1.1s infinite}
.sec{margin:20px 18px 10px;font-size:20px;display:flex;justify-content:space-between;align-items:baseline}
.sec small{font-size:12px;opacity:.55;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
.card{border:none;border-radius:22px;padding:0;color:#fff;text-align:left;position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(155deg,var(--g1),var(--g2));box-shadow:0 6px 0 rgba(0,0,0,.28),0 12px 24px rgba(0,0,0,.35);transition:transform .12s}
.card:active,.feat:active{transform:scale(.96)}
.card::after{content:"";position:absolute;top:-50%;left:-80%;width:50%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:rotate(20deg);animation:shine 4s infinite;animation-delay:var(--d);pointer-events:none}
@keyframes shine{0%,70%{left:-80%}100%{left:140%}}
.cthumb{width:100%;height:158px;display:block;background:#000;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.cbody{display:flex;gap:8px;align-items:center;padding:0 10px 11px;margin-top:-22px;position:relative}
.cicon{flex:none;font-size:28px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(155deg,var(--g1),var(--g2));border:2.5px solid rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(0,0,0,.25);animation:wob 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes wob{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.08)}}
.ctext{min-width:0;padding-top:16px}
.cname{font-size:15px;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.cmeta{font-size:11px;opacity:.9;margin-top:3px;font-weight:700}
.cbadge{position:absolute;top:8px;right:8px;font-size:10px;background:rgba(0,0,0,.5);padding:3px 7px;border-radius:99px;z-index:2}
.cbadge.ad{background:#ffd43b;color:#222}
.cbadge.ok{background:#2f9e44;color:#fff}
.card.wide{grid-column:span 2}
.card.wide .cthumb{height:180px}
.foot{text-align:center;font-size:11px;opacity:.45;padding:22px 20px 40px;font-weight:700;line-height:1.5}

/* ---------- STORE ---------- */
#store{background:linear-gradient(180deg,#1b1233,#0d0820)}
.st-scroll{flex:1;overflow-y:auto;scrollbar-width:none}
.st-scroll::-webkit-scrollbar{display:none}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 12px}
.back{border:none;background:rgba(255,255,255,.12);color:#fff;width:40px;height:40px;border-radius:14px;font-size:20px}
.topbar .t{font-size:15px;opacity:.7}
.st-media{position:relative;margin:4px 14px 0;height:min(60vh,440px);border-radius:24px;overflow:hidden;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.st-media canvas{width:100%;height:100%;display:block}
.badge{position:absolute;font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.55)}
.badge.l{top:10px;left:10px}.badge.r{top:10px;right:10px;background:#ffd43b;color:#222}
.badge.b{bottom:10px;left:50%;transform:translateX(-50%);opacity:.6;font-size:9px;white-space:nowrap}
.st-info{display:flex;gap:12px;align-items:center;padding:16px 16px 6px}
.st-ico{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:44px;flex:none;background:linear-gradient(155deg,var(--g1),var(--g2));box-shadow:0 5px 0 rgba(0,0,0,.25)}
.st-name{font-size:24px;line-height:1.05}
.st-dev{font-size:12px;opacity:.6;margin-top:3px;font-weight:700}
.st-row{display:flex;justify-content:space-around;padding:10px 12px;margin:6px 14px;border-radius:16px;background:rgba(255,255,255,.06)}
.st-row div{text-align:center;font-size:15px}
.st-row small{display:block;font-size:10px;opacity:.55;font-weight:700}
.install{position:relative;overflow:hidden;display:block;width:calc(100% - 28px);margin:10px 14px;border:none;border-radius:18px;padding:16px;font-size:22px;color:#fff;
  background:linear-gradient(#51cf66,#2b8a3e);box-shadow:0 6px 0 #1b5e2b,0 10px 20px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.install:active{transform:translateY(4px);box-shadow:0 2px 0 #1b5e2b}
.install .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.25);width:0}
.install span{position:relative}
.install.pulse{animation:pulse 1.1s infinite}
.rev-h{margin:18px 16px 6px;font-size:18px}
.rev{margin:8px 14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.06)}
.rev .who{font-size:13px;display:flex;justify-content:space-between}
.rev .who span{color:#ffd43b;letter-spacing:1px}
.rev p{margin:6px 0 0;font-size:13px;opacity:.85;font-weight:600;line-height:1.35;font-family:system-ui,sans-serif}
.rev.hidden{text-align:center;font-size:12px;opacity:.5;font-weight:700;background:none;border:1px dashed rgba(255,255,255,.2)}

/* ---------- GAME ---------- */
#game{background:#111}
.hud{display:flex;gap:6px;align-items:center;padding:8px 10px 6px;position:relative;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.2))}
.chip{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:6px 10px;font-size:14px;white-space:nowrap;color:#fff}
button.chip{border:1px solid rgba(255,255,255,.2)}
.chip.home{width:38px;height:34px;padding:0;font-size:18px}
.chip.noads{margin-left:auto;background:linear-gradient(#ff6b6b,#c92a2a);font-size:12px;animation:pulse 1.4s infinite}
.ratio{margin:0 10px 6px;height:20px;border-radius:99px;overflow:hidden;background:#2b8a3e;position:relative;font-size:11px;z-index:2}
.ratio .ad{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#e8590c,#f03e3e);width:50%;transition:width .5s}
.ratio .lbl{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 10px;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.stage{flex:1;position:relative;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.gift{position:absolute;right:10px;top:10px;z-index:3;border:none;background:none;font-size:34px;animation:bounce 1s infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.gift::after{content:"FREE";position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:10px;background:#f03e3e;color:#fff;border-radius:6px;padding:1px 4px}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
.lvl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:4;pointer-events:none;
  animation:lvlIn 1.3s forwards}
.lvl b{font-size:56px;text-shadow:0 5px 0 rgba(0,0,0,.4),0 0 30px rgba(255,212,59,.6);color:#ffd43b}
.lvl span{font-size:16px;opacity:.9}
@keyframes lvlIn{0%{transform:scale(2.5);opacity:0}20%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:scale(.8)}}
.splash{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;text-align:center;
  background:radial-gradient(circle at 50% 35%,var(--g1),var(--g2))}
.splash .si{font-size:96px;animation:wob 2s infinite;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.splash .sn{font-size:34px;line-height:1.05;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.splash .ss{font-size:14px;opacity:.9;background:rgba(0,0,0,.25);padding:4px 10px;border-radius:99px}
.lbar{width:80%;height:22px;border-radius:99px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:26px;border:2px solid rgba(255,255,255,.35)}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd43b,#fab005);border-radius:99px}
.lpct{font-size:18px}
.tip{font-size:13px;opacity:.85;min-height:36px;max-width:280px;font-weight:700}
.bannerad{height:66px;flex:none;position:relative;background:#fff;color:#222;display:flex;align-items:center;gap:10px;padding:8px 10px;overflow:hidden;cursor:pointer;z-index:2}
.bannerad .bi{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:30px;flex:none;background:linear-gradient(155deg,var(--g1),var(--g2));animation:wob 1.2s infinite}
.bannerad .bt{flex:1;min-width:0}
.bannerad .bt b{display:block;font-size:15px}
.bannerad .bt small{display:block;font-size:11px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bannerad .bb{background:#1c7ed6;color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;animation:pulse 1s infinite}
.bannerad .btag{position:absolute;top:2px;left:4px;font-size:8px;background:#ffd43b;padding:0 4px;border-radius:3px}
.bannerad.swap{animation:swap .45s}
@keyframes swap{from{transform:translateY(100%)}to{transform:none}}

/* ---------- OVERLAYS ---------- */
#layer{position:absolute;inset:0;z-index:100;pointer-events:none}
#layer>*{pointer-events:auto}
.pop-bg{position:absolute;inset:0;background:rgba(5,0,15,.62);display:flex;align-items:center;justify-content:center;animation:fade .2s;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}
.pop{width:86%;max-width:340px;background:linear-gradient(#ffffff,#eef0f6);border-radius:26px;padding:0 18px 18px;color:#2b2b3a;text-align:center;position:relative;
  box-shadow:0 10px 0 rgba(0,0,0,.25),0 30px 60px rgba(0,0,0,.5);animation:popIn .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{from{transform:scale(.4);opacity:0}}
.pop-title{font-size:22px;color:#fff;background:linear-gradient(#845ef7,#5f3dc4);margin:0 -18px 14px;padding:16px 34px 14px;border-radius:26px 26px 0 0;text-shadow:0 2px 0 rgba(0,0,0,.25);line-height:1.1}
.pop.offer .pop-title{background:linear-gradient(#ff922b,#e8590c)}
.pop.red .pop-title{background:linear-gradient(#ff6b6b,#c92a2a)}
.pop.green .pop-title{background:linear-gradient(#51cf66,#2b8a3e)}
.pop.ios{background:rgba(240,240,245,.97);border-radius:16px;padding:0;overflow:hidden;width:78%;font-family:system-ui,sans-serif}
.pop.ios .pop-title{background:none;color:#111;font-size:16px;text-shadow:none;padding:18px 16px 4px;margin:0;font-weight:700}
.pop.ios .pop-body{font-size:13px;font-weight:500;padding:0 16px 16px;color:#333}
.pop.ios .pop-btns{flex-direction:row;gap:0;margin:0;border-top:1px solid #ccc}
.pop.ios .pop-btns .btn{flex:1;background:none;box-shadow:none;color:#0a7cff;font-size:16px;border-radius:0;padding:12px;text-shadow:none;font-weight:600;font-family:system-ui}
.pop.ios .pop-btns .btn+.btn{border-left:1px solid #ccc}
.pop-body{font-size:16px;line-height:1.35;font-weight:700}
.pop-body .big{font-size:44px;margin:4px 0}
.pop-btns{display:flex;flex-direction:column;gap:10px;margin-top:16px;align-items:center}
.btn{border:none;border-radius:16px;padding:13px 20px;font-size:19px;color:#fff;width:100%;background:linear-gradient(#5c7cfa,#3b5bdb);box-shadow:0 5px 0 #2541a8;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.btn.green{background:linear-gradient(#51cf66,#2f9e44);box-shadow:0 5px 0 #1b6e2f}
.btn.gold{background:linear-gradient(#ffd43b,#f59f00);box-shadow:0 5px 0 #b56d00;color:#5c3500;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.link{background:none;box-shadow:none;color:#9a9aae;font-size:13px;padding:4px;text-shadow:none;width:auto}
.btn.hide{visibility:hidden}
.pulse{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.pop-x{position:absolute;top:8px;right:9px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.18);color:rgba(255,255,255,.75);font-size:11px;padding:0;z-index:2}
.offer-items{display:flex;justify-content:center;gap:10px;font-size:30px}
.offer-items div{background:#fff3bf;border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.offer-items b{font-size:13px;color:#e8590c}
.price{margin-top:12px;font-size:16px}
.price s{opacity:.5}.price b{font-size:28px;color:#e8590c}
.ribbon{position:absolute;top:56px;left:-8px;background:#f03e3e;color:#fff;font-size:13px;padding:4px 10px;border-radius:4px 10px 10px 4px;transform:rotate(-8deg);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.cd{font-size:13px;margin-top:6px;color:#c92a2a}
.stars{font-size:40px;letter-spacing:2px;cursor:pointer}
.stars span{display:inline-block;transition:transform .15s;filter:grayscale(1);opacity:.4}
.stars span.on{filter:none;opacity:1;transform:scale(1.15)}
.wheel-wrap{position:relative;width:230px;height:230px;margin:6px auto 0}
.wheel{width:100%;height:100%;border-radius:50%;border:6px solid #fff;box-shadow:0 0 0 4px #f59f00,0 8px 20px rgba(0,0,0,.3);position:relative;
  background:conic-gradient(#ff6b6b 0 45deg,#ffd43b 45deg 90deg,#51cf66 90deg 135deg,#ffd43b 135deg 180deg,#339af0 180deg 225deg,#ffd43b 225deg 270deg,#cc5de8 270deg 315deg,#ffd43b 315deg 360deg);
  transition:transform 3.2s cubic-bezier(.15,.85,.2,1)}
.wheel span{position:absolute;left:50%;top:50%;font-size:13px;color:#222;transform-origin:0 0;white-space:nowrap}
.wheel-pin{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:28px;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}
.days div{background:#e9ecef;border-radius:12px;padding:6px 2px;opacity:.6}
.days div b{display:block;font-size:20px}
.days div.today{background:#ffd43b;opacity:1;box-shadow:0 0 0 3px #f59f00;animation:pulse 1s infinite}
.days div.wide{grid-column:span 2}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid #ddd;border-top-color:#5f3dc4;margin:10px auto;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ads */
.adov{position:absolute;inset:0;background:#000;animation:fade .15s;z-index:10}
.adov canvas{position:absolute;inset:0;width:100%;height:100%}
.adtop{position:absolute;left:0;right:0;top:0;padding:calc(var(--safe) + 8px) 12px 8px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;background:linear-gradient(rgba(0,0,0,.5),transparent)}
.adtag{font-size:11px;background:#ffd43b;color:#222;padding:3px 8px;border-radius:6px;font-family:system-ui,sans-serif;font-weight:700}
.adtimer{font-size:13px;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:99px;font-family:system-ui,sans-serif;font-weight:700;border:1px solid rgba(255,255,255,.25)}
.adx{position:absolute;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);color:rgba(255,255,255,.8);font-size:13px;padding:0;
  transition:left .18s,top .18s;z-index:5;font-family:system-ui}
.adx.tiny{width:18px;height:18px;font-size:9px;opacity:.6}
.adcta{position:absolute;left:10px;right:10px;bottom:14px;background:rgba(255,255,255,.96);border-radius:18px;display:flex;align-items:center;gap:10px;padding:9px;color:#222;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.adcta .ai{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:28px;background:linear-gradient(155deg,var(--g1),var(--g2));flex:none}
.adcta .am{flex:1;min-width:0}.adcta .am b{display:block;font-size:15px}
.adcta .am small{font-size:11px;opacity:.6;font-family:system-ui;font-weight:600}
.adcta .ab{border:none;background:#1c7ed6;color:#fff;font-size:15px;padding:10px 14px;border-radius:12px;animation:pulse 1s infinite}
.endcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:30px;z-index:4;
  background:radial-gradient(circle at 50% 30%,var(--g1),var(--g2));animation:fade .3s}
.endcard .ei{font-size:110px;width:170px;height:170px;border-radius:44px;display:grid;place-items:center;background:rgba(255,255,255,.2);box-shadow:0 10px 0 rgba(0,0,0,.2);animation:wob 1.6s infinite}
.endcard .en{font-size:34px;text-shadow:0 4px 0 rgba(0,0,0,.25);line-height:1.05}
.endcard .es{color:#ffd43b;font-size:22px;letter-spacing:3px}
.endcard .eh{font-size:15px;opacity:.95}
.endcard .eb{margin-top:12px;border:none;font-size:26px;padding:18px 34px;border-radius:20px;background:#fff;color:#1c7ed6;box-shadow:0 7px 0 rgba(0,0,0,.25);animation:pulse .9s infinite}
.endcard .cont{position:absolute;right:16px;bottom:18px;border:none;background:none;color:rgba(255,255,255,.45);font-size:12px;font-family:system-ui}
.store-flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:rgba(255,255,255,.96);color:#333;z-index:6;font-family:system-ui;font-weight:600}

#toasts{position:absolute;top:calc(var(--safe) + 56px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:300;pointer-events:none}
.toast{background:rgba(25,12,50,.94);border:1px solid rgba(255,255,255,.15);color:#fff;padding:10px 14px;border-radius:14px;font-size:14px;max-width:88%;text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.4);animation:tin .3s cubic-bezier(.2,1.5,.4,1)}
.toast.out{transition:opacity .3s,transform .3s;opacity:0;transform:translateY(-10px)}
@keyframes tin{from{transform:translateY(-20px) scale(.9);opacity:0}}
.countbig{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.5);font-size:22px}
.countbig b{font-size:110px;color:#ffd43b;text-shadow:0 6px 0 rgba(0,0,0,.4)}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>

<script>
'use strict';
/* =====================================================================
   AdTrap Arcade — 12 "games" that are exactly like the ads*.
   *They are not.
   ===================================================================== */

const FONT='"Lilita One","Baloo 2","Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,sans-serif';
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const $=(s,r=document)=>r.querySelector(s);
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;};
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const easeIn=p=>p*p;
const outBack=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const R=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const fmtT=s=>{s=Math.floor(s);return s<60?s+'s':Math.floor(s/60)+'m '+(s%60)+'s';};

/* =====================================================================
   RENDER KIT — glossy panels, sticker emoji, glows, textures, particles
   ===================================================================== */
let X, AT=0;
let WT='bold ';
if(document.fonts){document.fonts.load('40px "Lilita One"').then(()=>{if(document.fonts.check('40px "Lilita One"'))WT='';}).catch(()=>{});}
function mk(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c;}
const hexRGB=hx=>{hx=hx.replace('#','');if(hx.length===3)hx=hx.split('').map(c=>c+c).join('');const n=parseInt(hx,16);return[n>>16&255,n>>8&255,n&255];};
const shadeC=(hx,a)=>{if(hx[0]!=='#')return hx;const c=hexRGB(hx).map(v=>Math.round(a>0?v+(255-v)*a:v*(1+a)));return`rgb(${c[0]},${c[1]},${c[2]})`;};
const rgba=(hx,a)=>{const c=hexRGB(hx);return`rgba(${c[0]},${c[1]},${c[2]},${a})`;};
function lin(y0,y1,st){const g=X.createLinearGradient(0,y0,0,y1);st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g;}
function linX(x0,x1,st){const g=X.createLinearGradient(x0,0,x1,0);st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g;}
function rg(x,y,r,st,ox=0,oy=0){const g=X.createRadialGradient(x+ox,y+oy,0,x,y,Math.max(.1,r));st.forEach((c,i)=>g.addColorStop(i/(st.length-1),c));return g;}
function rr(x,y,w,hh,r,fill,stroke,lw=4){X.beginPath();X.roundRect(x,y,Math.max(0,w),Math.max(0,hh),r);if(fill){X.fillStyle=fill;X.fill();}if(stroke){X.lineWidth=lw;X.strokeStyle=stroke;X.stroke();}}
function circ(x,y,r,fill,stroke,lw=3){X.beginPath();X.arc(x,y,Math.max(0,r),0,Math.PI*2);if(fill){X.fillStyle=fill;X.fill();}if(stroke){X.strokeStyle=stroke;X.lineWidth=lw;X.stroke();}}
function ell(x,y,rx,ry,fill,stroke,lw=3){X.beginPath();X.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2);if(fill){X.fillStyle=fill;X.fill();}if(stroke){X.strokeStyle=stroke;X.lineWidth=lw;X.stroke();}}
function poly(pts,fill,stroke,lw=3){X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.closePath();if(fill){X.fillStyle=fill;X.fill();}if(stroke){X.strokeStyle=stroke;X.lineWidth=lw;X.lineJoin='round';X.stroke();}}
function line(pts,col,lw,cap='round'){X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.strokeStyle=col;X.lineWidth=lw;X.lineCap=cap;X.lineJoin='round';X.stroke();}
function bg(c1,c2){X.fillStyle=lin(0,640,[c1,c2]);X.fillRect(-900,-900,2160,2440);}
function sky(c1,c2,c3){X.fillStyle=lin(-200,640,[c1,c2,c3]);X.fillRect(-900,-900,2160,2440);}

/* textures (overlays, tinted by whatever is underneath) */
const TEXG={
  brick:()=>mk(96,48,g=>{for(let r=0;r<2;r++)for(let c=-1;c<3;c++){const x=c*48+(r?24:0),y=r*24;g.fillStyle=`rgba(${R(r*7+c)>.5?255:0},${R(r*7+c)>.5?255:0},${R(r*7+c)>.5?255:0},${.03+R(r*3+c*5)*.07})`;g.fillRect(x+2,y+2,44,20);g.fillStyle='rgba(255,255,255,.07)';g.fillRect(x+2,y+2,44,3);g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x+2,y+19,44,3);}
    g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,0,96,2);g.fillRect(0,24,96,2);for(let r=0;r<2;r++)for(let c=0;c<3;c++)g.fillRect(c*48+(r?24:0),r*24,2,24);}),
  stone:()=>mk(120,60,g=>{const ws=[[0,0,50,30],[50,0,40,30],[90,0,30,30],[0,30,30,30],[30,30,55,30],[85,30,35,30]];ws.forEach((b,i)=>{g.fillStyle=`rgba(${R(i)>.5?255:0},${R(i)>.5?255:0},${R(i)>.5?255:0},${.04+R(i+4)*.08})`;g.fillRect(b[0]+2,b[1]+2,b[2]-4,b[3]-4);g.fillStyle='rgba(255,255,255,.1)';g.fillRect(b[0]+2,b[1]+2,b[2]-4,2);g.fillStyle='rgba(0,0,0,.2)';g.fillRect(b[0]+2,b[1]+b[3]-4,b[2]-4,2);g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=2;g.strokeRect(b[0]+1,b[1]+1,b[2]-2,b[3]-2);});}),
  sand:()=>mk(96,96,g=>{for(let i=0;i<420;i++){g.fillStyle=R(i)>.5?`rgba(255,240,200,${.15+R(i+1)*.25})`:`rgba(110,60,10,${.1+R(i+2)*.2})`;g.fillRect(R(i+3)*96,R(i+4)*96,1+R(i+5)*2,1+R(i+6)*2);}}),
  asphalt:()=>mk(96,96,g=>{for(let i=0;i<500;i++){g.fillStyle=R(i)>.5?`rgba(255,255,255,${.04+R(i+1)*.06})`:`rgba(0,0,0,${.08+R(i+2)*.12})`;g.fillRect(R(i+3)*96,R(i+4)*96,1+R(i+5)*2,1+R(i+5)*2);}}),
  wood:()=>mk(128,32,g=>{for(let r=0;r<2;r++){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,r*16+14,128,2);g.fillRect((r*61)%128,r*16,2,16);for(let i=0;i<6;i++){g.strokeStyle=`rgba(${R(i+r)>.5?255:60},${R(i+r)>.5?220:30},${R(i+r)>.5?180:0},.12)`;g.lineWidth=1;g.beginPath();g.moveTo(0,r*16+2+i*2);g.bezierCurveTo(40,r*16+i*2,80,r*16+4+i*2,128,r*16+2+i*2);g.stroke();}}}),
  grain:()=>mk(128,128,g=>{for(let i=0;i<1600;i++){g.fillStyle=`rgba(${R(i)>.5?255:0},${R(i)>.5?255:0},${R(i)>.5?255:0},${R(i+9)*.06})`;g.fillRect(R(i+1)*128,R(i+2)*128,1,1);}}),
};
const TEXC={};
function texture(name,x,y,w,hh,a=1){const cache=X.__p||(X.__p={});if(!TEXC[name])TEXC[name]=TEXG[name]();if(!cache[name])cache[name]=X.createPattern(TEXC[name],'repeat');X.save();X.globalAlpha*=a;X.fillStyle=cache[name];X.fillRect(x,y,w,hh);X.restore();}

/* emoji as cached sticker images (white outline + soft shadow) */
const EMC=new Map(),EB=128,EPAD=26;
function emImg(ch,ol){const k=ch+(ol?'\u0001':'');let c=EMC.get(k);if(c)return c;const S=EB+EPAD*2;
  const base=mk(S,S,g=>{g.font=`${EB*.86}px ${EMOJI}`;g.textAlign='center';g.textBaseline='middle';g.fillText(ch,S/2,S/2+EB*.05);});
  if(!ol){EMC.set(k,base);return base;}
  const sil=mk(S,S,g=>{g.drawImage(base,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#fff';g.fillRect(0,0,S,S);});
  const dark=mk(S,S,g=>{for(let i=0;i<16;i++){const a=i/16*Math.PI*2;g.drawImage(sil,Math.cos(a)*9,Math.sin(a)*9);}g.globalCompositeOperation='source-in';g.fillStyle='rgba(25,8,45,.5)';g.fillRect(0,0,S,S);});
  c=mk(S,S,g=>{g.drawImage(dark,0,4);for(let i=0;i<16;i++){const a=i/16*Math.PI*2;g.drawImage(sil,Math.cos(a)*6,Math.sin(a)*6);}g.drawImage(base,0,0);});
  EMC.set(k,c);return c;}
function em(ch,x,y,s,o={}){const a=o.a??1;if(s<=0||a<=0)return;const img=emImg(ch,!!o.ol);const S=img.width*s/(EB*.86);X.save();X.globalAlpha*=a;X.translate(x,y);if(o.rot)X.rotate(o.rot);X.scale((o.flip?-1:1)*(o.sx||1),o.sy||1);X.drawImage(img,-S/2,-S/2,S,S);X.restore();}
function shad(x,y,w,a=.3){if(w<=0)return;X.save();X.translate(x,y);X.scale(1,.3);X.fillStyle=rg(0,0,w,[`rgba(0,0,0,${a})`,`rgba(0,0,0,${a*.6})`,'rgba(0,0,0,0)']);X.fillRect(-w,-w,2*w,2*w);X.restore();}
function actor(ch,x,y,s,t,o={}){const still=!!o.still;const b=still?1:Math.abs(Math.sin(t*(o.speed||5)+(o.ph||0)));shad(x,y+s*.44,s*.42,.38*(o.a??1));
  em(ch,x,y-(1-b)*s*.1,s,{ol:o.ol??true,a:o.a,flip:o.flip,rot:o.rot,sx:still?1:1+b*.05,sy:still?1:1-b*.05});}
function glow(x,y,r,col,a=1){if(r<=0||a<=0)return;X.save();X.globalCompositeOperation='lighter';X.globalAlpha*=a;X.fillStyle=rg(x,y,r,[col,'rgba(0,0,0,0)']);X.fillRect(x-r,y-r,2*r,2*r);X.restore();}
function spark(x,y,s,a=1){if(a<=0||s<=0)return;glow(x,y,s*2.2,'rgba(255,250,210,.7)',a);X.save();X.globalAlpha*=a;X.translate(x,y);X.fillStyle='#fff';X.beginPath();for(let i=0;i<8;i++){const r=i%2?s*.2:s,an=i*Math.PI/4;X.lineTo(Math.cos(an)*r,Math.sin(an)*r);}X.fill();X.restore();}
function rays(x,y,r,n,col,rot){X.save();X.translate(x,y);X.rotate(rot);X.fillStyle=col;for(let i=0;i<n;i++){const a=i*Math.PI*2/n;X.beginPath();X.moveTo(0,0);X.arc(0,0,r,a,a+Math.PI/n);X.closePath();X.fill();}X.restore();}
function burst(x,y,r,n,col,rot=0,inner=.55){X.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,q=i%2?r*inner:r;X.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}X.closePath();X.fillStyle=col;X.fill();}
function impact(x,y,p,s=1){if(p<=0||p>=1)return;const k=outBack(Math.min(1,p*2.2));X.save();X.globalAlpha=1-Math.max(0,p-.6)/.4;burst(x,y,46*s*k,9,'#ffd43b',p*2);burst(x,y,30*s*k,9,'#fff',p*2+.3);X.restore();for(let i=0;i<8;i++){const a=i*Math.PI/4+.3;circ(x+Math.cos(a)*60*s*p,y+Math.sin(a)*60*s*p,4*s*(1-p),'#fff3bf');}}
function embers(t,x,y,w,hh,n,seed=1,col=[255,160,60]){X.save();X.globalCompositeOperation='lighter';for(let i=0;i<n;i++){const P=1+R(seed+i)*1.4,ph=(t/P+R(seed+i*3))%1;const px=x+R(seed+i*7)*w+Math.sin(t*3+i)*5,py=y+hh-ph*hh,a=Math.sin(ph*Math.PI);circ(px,py,1.3+R(i*9+seed)*2.3,`rgba(${col[0]},${col[1]+(R(i)*60|0)},${col[2]},${a})`);}X.restore();}
function smoke(t,t0,x,y,n=8,spread=30,col='70,70,80'){const d=t-t0;if(d<0)return;for(let i=0;i<n;i++){const ph=(d*.8+R(i+5))%1;circ(x+(R(i)-.5)*spread+Math.sin(t*2+i)*8,y-ph*90,8+ph*24,`rgba(${col},${.42*(1-ph)*Math.min(1,d*3)})`);}}
function sparkles(t,x,y,w,hh,n,seed=3){for(let i=0;i<n;i++){const ph=(t*.7+R(seed+i))%1.4;if(ph>1)continue;spark(x+R(seed+i*5)*w,y+R(seed+i*11)*hh,3+R(i)*5,Math.sin(ph*Math.PI));}}
function cloud(x,y,s,a=1){X.save();X.globalAlpha*=a;X.translate(x,y);X.scale(s,s);const P=[[-28,6,17],[-10,-7,23],[14,-4,20],[32,7,14],[0,9,19]];for(const p of P)circ(p[0],p[1]+5,p[2],'rgba(60,100,170,.16)');for(const p of P)circ(p[0],p[1],p[2],rg(p[0],p[1],p[2],['#ffffff','#f3f7ff','#d6e3f7'],-p[2]*.3,-p[2]*.5));X.restore();}
function sunb(x,y,r,t){glow(x,y,r*4.5,'rgba(255,240,170,.55)');X.save();X.globalCompositeOperation='lighter';rays(x,y,r*7,12,'rgba(255,250,210,.07)',t*.15);X.restore();circ(x,y,r,rg(x,y,r,['#fffdf0','#ffe066','#ffbf1a']));}
function hill(y,amp,col,seed){X.beginPath();X.moveTo(-300,900);X.lineTo(-300,y);for(let x=-300;x<=660;x+=20)X.lineTo(x,y-Math.sin(x*.012+seed)*amp-Math.sin(x*.031+seed*2)*amp*.4);X.lineTo(660,900);X.closePath();X.fillStyle=col;X.fill();}
function torch(x,y,t,s=1){const f=1+Math.sin(t*23+x)*.06+Math.sin(t*37+x)*.04;glow(x,y-14*s,95*s*f,'rgba(255,140,40,.5)');rr(x-4*s,y,8*s,30*s,3,lin(y,y+30*s,['#7a4a24','#3d2410']));rr(x-10*s,y-4*s,20*s,9*s,3,lin(y-4*s,y+5*s,['#adb5bd','#495057']),'#212529',1.5);flame(x,y-3*s,15*s*f,t,x);}
function flame(x,y,s,t,seed=0){const w=Math.sin(t*14+seed)*s*.18;const L=(k,col)=>{X.beginPath();X.moveTo(x-s*.55*k,y);X.quadraticCurveTo(x-s*.62*k,y-s*.9*k,x+w*k,y-s*1.65*k);X.quadraticCurveTo(x+s*.62*k,y-s*.9*k,x+s*.55*k,y);X.quadraticCurveTo(x,y+s*.38*k,x-s*.55*k,y);X.fillStyle=col;X.fill();};L(1,'#ff3d00');L(.74,'#ff9f1a');L(.44,'#fff3a0');}
function coin(x,y,r,t,i=0){circ(x+1,y+3,r,'rgba(0,0,0,.35)');circ(x,y,r,rg(x,y,r*1.1,['#fffbe0','#ffd43b','#f08c00','#c25e00'],-r*.35,-r*.45));circ(x,y,r,null,'#a34d00',1.8);circ(x,y,r*.68,null,'rgba(255,255,255,.35)',1.4);tx('$',x,y+1,r*1.05,'#c76a00',null);const g=(t*.9+i*.37)%2.4;if(g<.35)spark(x+r*.4,y-r*.45,r*.85,Math.sin(g/.35*Math.PI));}
function gball(x,y,r){circ(x+1,y+2.5,r,'rgba(0,0,0,.3)');circ(x,y,r,rg(x,y,r*1.1,['#fffbe6','#ffd43b','#e8890c','#a85400'],-r*.35,-r*.4));circ(x-r*.35,y-r*.4,r*.28,'rgba(255,255,255,.9)');}

/* text */
function tx(s,x,y,size,fill='#fff',stroke='#1a1033',maxW=340,align='center'){s=String(s);X.save();X.font=`${WT}${size}px ${FONT}`;const w=X.measureText(s).width;if(w>maxW){size*=maxW/w;X.font=`${WT}${size}px ${FONT}`;}
  X.textAlign=align;X.textBaseline='middle';X.lineJoin='round';X.miterLimit=2;
  if(stroke){const d=size*.1;X.lineWidth=size*.26;X.strokeStyle=stroke;X.strokeText(s,x,y+d);X.fillStyle=stroke;X.fillText(s,x,y+d);X.strokeText(s,x,y);}
  X.fillStyle=fill[0]==='#'?lin(y-size*.45,y+size*.45,[shadeC(fill,.5),fill,shadeC(fill,-.18)]):fill;X.fillText(s,x,y);X.restore();}
function panel(x,y,w,hh,r,col,o={}){const d=o.depth??6;r=Math.min(r,hh/2,w/2);if(d)rr(x,y+d,w,hh,r,o.edge||shadeC(col,-.5));rr(x,y,w,hh,r,lin(y,y+hh,[shadeC(col,.28),col,shadeC(col,-.12)]));if(o.gloss!==false)rr(x+Math.min(6,w*.05),y+hh*.07,w-Math.min(12,w*.1),hh*.4,Math.min(r,hh*.2),'rgba(255,255,255,.26)');rr(x,y,w,hh,r,null,o.stroke||'rgba(255,255,255,.5)',o.lw||2);}
function pill(x,y,s,col='#7048e8',tc='#fff',size=16){s=String(s);X.save();X.font=`${WT}${size}px ${FONT}`;const w=X.measureText(s).width+size*1.3,hh=size*1.6;X.restore();panel(x-w/2,y-hh/2,w,hh,hh/2,col,{depth:3,lw:1.5});tx(s,x,y+1,size,tc,'rgba(0,0,0,.4)');}
function headline(s,t,y=74,size=31,col='#ffe14d'){X.save();X.translate(180,y);const k=1+Math.sin(t*7)*.035;X.scale(k,k);X.rotate(Math.sin(t*3)*.02);tx(s,0,0,size,col,'#2a0d4a',336);X.restore();}

/* timing helpers */
function path(t,keys){if(t<=keys[0][0])return[keys[0][1],keys[0][2]];for(let i=1;i<keys.length;i++){if(t<=keys[i][0]){const a=keys[i-1],b=keys[i];const p=ease((t-a[0])/((b[0]-a[0])||1));return[lerp(a[1],b[1],p),lerp(a[2],b[2],p)];}}const l=keys[keys.length-1];return[l[1],l[2]];}
const vis=(t,a,b)=>clamp(Math.min((t-a)/.2,(b-t)/.2));

function bokehBg(W,H,c1,c2,t){X.fillStyle=lin(0,H,[c1,c2]);X.fillRect(0,0,W,H);for(let i=0;i<10;i++)glow(R(i)*W+Math.sin(t*.3+i)*20,R(i+7)*H,40+R(i+2)*60,'rgba(255,255,255,.07)');}

    update(dt){t+=dt;for(let c=0;c<cols;c++)grid[c].forEach((tl,r)=>{tl.y=Math.min(r,tl.y+dt*14);});pops=pops.filter(p=>(p.t+=dt)<.7);parts=parts.filter(p=>(p.t+=dt)<.5);shake=Math.max(0,shake-dt);},
    draw(){bokehBg(W,H,'#3b1d7a','#12072b',t);

      const sx=shake?Math.sin(shake*80)*4:0;
      panel(ox-10+sx,oy-10,sz*cols+20,sz*rows+20,22,'#6741d9',{depth:8,gloss:false,stroke:'rgba(255,255,255,.4)'});rr(ox-4+sx,oy-4,sz*cols+8,sz*rows+8,16,'#1c0b45');
      X.save();X.beginPath();X.rect(ox-6,oy-6,sz*cols+12,sz*rows+12);X.clip();
      for(let c=0;c<cols;c++)grid[c].forEach(tl=>{const x=ox+c*sz+sx,y=oy+tl.y*sz,col=cl[tl.k],r=sz*.24;
        rr(x+3,y+6,sz-6,sz-6,r,'rgba(0,0,0,.35)');rr(x+3,y+3,sz-6,sz-6,r,lin(y,y+sz,[shadeC(col,.4),col,shadeC(col,-.25)]));rr(x+7,y+6,sz-14,(sz-6)*.38,r*.7,'rgba(255,255,255,.33)');rr(x+3,y+3,sz-6,sz-6,r,null,'rgba(255,255,255,.5)',1.5);
        em(th[tl.k%th.length],x+sz/2,y+sz/2+1,sz*.56,{});});

      for(const p of parts){const q=p.t/.5;for(let i=0;i<6;i++){const a=i*Math.PI/3+p.x;circ(p.x+Math.cos(a)*q*sz*.9,p.y+Math.sin(a)*q*sz*.9,sz*.12*(1-q),p.c);}spark(p.x,p.y,sz*.35*(1-q),1-q);}

    tap(x,y){const c=Math.floor((x-ox)/sz),r=Math.floor((y-oy)/sz);if(c<0||c>=cols||r<0||r>=rows)return;const k=grid[c][r].k;
      const seen=new Set(),st=[[c,r]];while(st.length){const[a,b]=st.pop();const key=a+','+b;if(seen.has(key)||a<0||a>=cols||b<0||b>=rows||grid[a][b].k!==k)continue;seen.add(key);st.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);}

  if(dead(s)||OV.busy()||s.phase==='loading')return;
  const prev=s.phase;s.phase='int';
  const r=await popup({title:'Leaving so soon? 😢',html:'Watch one last ad as a goodbye?',buttons:[{label:'📺 Sure!',cls:'green',value:'y'},{label:'Leave',cls:'link',value:'n',delay:1500}],closeAfter:1500});
  if(dead(s))return;
  if(r==='close'){s.phase=prev==='intro'?'play':prev;return;}
  if(r==='n')toast('Of course! Here is a goodbye ad 👋');
  const a=await showAd(s.g);if(dead(s)||a!=='ok')return;
  endSession();renderHome();
}
async function noAdsFlow(s){
  if(dead(s)||OV.busy()||s.phase==='loading')return;
  const prev=s.phase;s.phase='int';
  const r=await popup({cls:'red',title:'🚫 REMOVE ADS',html:'<div class="big">🙅</div>Enjoy the game with <b>no interruptions</b>*<br><b style="font-size:26px;color:#c92a2a">$9.99</b><br><small style="opacity:.6">*some ads may still appear. all of them, actually.</small>',closeAfter:800,buttons:[{label:'BUY $9.99',cls:'gold',value:'buy'}]});
  if(dead(s))return;
  if(r==='buy'){
    await popup({title:'Processing…',html:'<div class="spin"></div>Contacting payment servers',onMount(el,done){setTimeout(()=>done(1),1400);}});if(dead(s))return;
    await popup({title:'One more step!',html:'To purchase <b>No Ads</b>, please watch this short ad 📺',buttons:[{label:'OK',cls:'green',value:1}]});if(dead(s))return;
    if(await adBlock(s))return;
    await popup({cls:'red',title:'❌ Purchase failed',html:'Error 404: <b>No Ads</b> not found.<br>Please try again after the next ad.',buttons:[{label:'OK 😐',value:1}]});if(dead(s))return;}
  s.phase=prev==='intro'?'play':prev;
}

/* ---------------- main loop ---------------- */
let last=performance.now(),ratioT=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  renderLive(now);
  if(OV.ads>0){ST.adTime+=dt;if(S)S.adT+=dt;}
  const s=S;
  if(s&&!s.dead&&s.real){
    if(s.phase==='play'&&!OV.busy()){
      s.real.update(dt);s.playT+=dt;ST.playTime+=dt;s.nextInt-=dt;
      if(s.real.status==='win')levelWin(s);
      else if(s.real.status==='fail')levelFail(s);
      else if(s.real.wantBoost){s.real.wantBoost=false;boostFlow(s);}
      else if(s.nextInt<=0&&!adFree(s.g))interrupt(s);
    }
    const cv=$('#game .stage canvas');
    if(cv){const dpr=Math.min(2,devicePixelRatio||1),cw=cv.clientWidth,ch=cv.clientHeight;if(cw&&ch){const w=Math.round(cw*dpr),hh=Math.round(ch*dpr);if(cv.width!==w||cv.height!==hh){cv.width=w;cv.height=hh;}
      X=cv.getContext('2d');X.setTransform(1,0,0,1,0,0);X.fillStyle='#111';X.fillRect(0,0,w,hh);const sc=Math.min(cw/s.W,ch/s.H)*dpr;X.setTransform(sc,0,0,sc,(w-s.W*sc)/2,(hh-s.H*sc)/2);try{s.real.draw();}catch(e){console.error(e);}}}
  }
  ratioT+=dt;if(ratioT>.5&&s){ratioT=0;updRatio(s);}
  requestAnimationFrame(frame);
}
addEventListener('keydown',e=>{const s=S;if(!s||!s.real||s.phase!=='play'||OV.busy())return;
  if(s.real.key){const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]}[e.key];if(m){e.preventDefault();s.real.key(m);}return;}
  if(e.key==='ArrowLeft')s.real.tap(s.W*.25,s.H*.5);else if(e.key==='ArrowRight')s.real.tap(s.W*.75,s.H*.5);else if(e.key===' '||e.key==='Enter'){e.preventDefault();s.real.tap(s.W*.5,s.H*.4);}});

renderHome();
requestAnimationFrame(frame);
</script>
